name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          xcode-select -p || true
          sw_vers

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Lint Info.plist
        run: plutil -lint DSHMobile/Info.plist

      - name: Sanity check injected assets
        run: |
          set -e
          for f in mobile.css inject.js early-polyfill.js ios-tweaks.css; do
            p="DSHMobile/Resources/$f"
            if [ ! -s "$p" ]; then echo "::error::缺少资源 $p"; exit 1; fi
            echo "$f -> $(wc -c < "$p") bytes"
          done
          test -s DSHMobile/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png || { echo "::error::缺少 AppIcon"; exit 1; }

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (code signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHMobile.xcodeproj \
            -scheme DSHMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        id: pack
        run: |
          set -e
          APP_DIR="build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::没有产出 .app"; exit 1; fi
          echo "APP=$APP"

          # 产物自检
          echo "--- .app 顶层 ---"
          ls -la "$APP" | head -40

          # 资源兜底：XcodeGen 若因版本差异没把 Resources 打进 bundle，
          # 这里手动补到 .app 根目录。Bundle.main.url(forResource:) 找的就是根目录，
          # 所以 cp 过去效果等价，不会出现"编译成功但界面没适配"的空壳。
          for f in mobile.css inject.js early-polyfill.js ios-tweaks.css; do
            if [ ! -f "$APP/$f" ]; then
              echo "::warning::$f 没进 bundle，用兜底方式补入"
              cp "DSHMobile/Resources/$f" "$APP/$f"
            fi
          done

          echo "--- 注入资源是否进包 ---"
          for f in mobile.css inject.js early-polyfill.js ios-tweaks.css; do
            if [ -f "$APP/$f" ]; then echo "OK  $f $(wc -c < "$APP/$f")"; else echo "::error::$f 没进 bundle"; exit 1; fi
          done
          echo "--- 二进制架构 ---"
          file "$APP/DSHMobile"
          lipo -info "$APP/DSHMobile"

          rm -rf Payload DSHMobile-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 去掉可能残留的签名目录，交给签名工具重签
          rm -rf Payload/*.app/_CodeSignature || true
          rm -rf Payload/*.app/embedded.mobileprovision || true
          /usr/bin/zip -qry DSHMobile-unsigned.ipa Payload
          ls -lh DSHMobile-unsigned.ipa
          echo "size=$(stat -f%z DSHMobile-unsigned.ipa)" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSHMobile-unsigned-ipa
          path: DSHMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
