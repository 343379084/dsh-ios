# runner 可用性诊断：build-ipa 若在排队阶段就被 cancelled、runner 为空，
# 先手动跑这个，确认 ubuntu/macos 两种 runner 在本仓库是否可用。
name: test-runner

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: hello-linux
        run: |
          echo "ubuntu runner OK"
          uname -a

  macos:
    runs-on: macos-latest
    steps:
      - name: hello-macos
        run: |
          echo "macos runner OK"
          sw_vers
          xcodebuild -version
